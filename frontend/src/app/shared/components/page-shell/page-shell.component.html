<section class="page-shell">
  <header class="page-shell__header">
    <div>
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p class="page-shell__subtitle">{{ subtitle() }}</p>
      }
    </div>

    <mat-chip-set>
      <mat-chip>{{ status() }}</mat-chip>
    </mat-chip-set>
  </header>

  <div class="page-shell__content">
    <ng-content />
  </div>
</section>
