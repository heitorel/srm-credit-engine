<div class="shell">
  <mat-toolbar class="shell__toolbar">
    <div class="shell__brand">
      <span class="shell__kicker">SRM Credit Engine</span>
      <strong>Painel operacional</strong>
    </div>

    <nav class="shell__nav" aria-label="Principal">
      @for (item of navigationItems; track item.route) {
        <a
          matButton
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
          [routerLink]="item.route"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </mat-toolbar>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
