server:
  port: ${SERVER_PORT:${BACKEND_PORT:8080}}

spring:
  application:
    name: srm-credit-engine-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srm_credit_engine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:srm_app}
    password: ${SPRING_DATASOURCE_PASSWORD:srm_app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
  mvc:
    problemdetails:
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

application:
  defaults:
    base-rate: ${DEFAULT_BASE_RATE:0.01000000}
  reference-data:
    supported-currencies: ${SUPPORTED_CURRENCIES:BRL,USD}
  startup-test-data:
    enabled: ${STARTUP_TEST_DATA_ENABLED:false}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.srm.creditengine: ${LOGGING_LEVEL_APP:INFO}
